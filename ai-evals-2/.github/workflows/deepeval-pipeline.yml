name: DeepEval Library Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-deepeval:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install deepeval google-genai python-dotenv

    # Notice this targets your NEW file specifically
    - name: Run DeepEval Tests
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: ./ai-evals-2
      run: |
        python ai-evals-2/deepeval.py